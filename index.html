<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NGA — تحميل منظومة WATAD للويندوز والهاتف.">
  <meta name="theme-color" content="#070B14">
  <title>NGA — تحميل WATAD</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <img src="assets/logo.png" alt="NGA">
        <span>
          <span class="brand-name">NGA</span>
          <span class="brand-tag">WATAD</span>
        </span>
      </a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang-btn="ar">العربية</button>
        <button type="button" data-lang-btn="en">English</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <span class="kicker" data-ar="التحميل الرسمي" data-en="Official downloads"></span>
        <h1 data-ar="منظومة WATAD" data-en="WATAD"></h1>
        <p class="lead" data-ar="برامج ويندوز: السيرفر، المركز، والفرع. وتطبيق الهاتف من متجر بلاي." data-en="Windows apps: Server, Headquarters, and Branch. Plus the phone app on Google Play."></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#downloads" data-ar="تحميل البرامج" data-en="Download the apps"></a>
          <a class="btn btn-ghost" href="#mobile" data-ar="تطبيق الهاتف" data-en="Phone app"></a>
        </div>
      </div>
    </section>

    <section class="section" id="downloads">
      <div class="wrap">
        <h2 data-ar="برامج ويندوز" data-en="Windows programs"></h2>
        <p class="section-intro" data-ar="ويندوز 10 أو 11، نسخة 64 بت." data-en="Windows 10 or 11, 64-bit."></p>

        <div class="cards">
          <article class="card">
            <h3 data-ar="WATAD السيرفر" data-en="WATAD Server"></h3>
            <div class="meta">
              <span>Windows x64</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-Server-Setup.exe" data-ar="تحميل السيرفر" data-en="Download Server"></a>
          </article>

          <article class="card">
            <h3 data-ar="WATAD المركز" data-en="WATAD Headquarters"></h3>
            <div class="meta">
              <span>Windows x64</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-HQ-Setup.exe" data-ar="تحميل المركز" data-en="Download Headquarters"></a>
          </article>

          <article class="card">
            <h3 data-ar="WATAD الفرع" data-en="WATAD Branch"></h3>
            <div class="meta">
              <span>Windows x64</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-Branch-Setup.exe" data-ar="تحميل الفرع" data-en="Download Branch"></a>
          </article>
        </div>
      </div>
    </section>

    <section class="section" id="mobile">
      <div class="wrap">
        <h2 data-ar="الهاتف" data-en="Phone"></h2>
        <article class="card card-feature">
          <span class="badge">Google Play</span>
          <h3 data-ar="WATAD موبايل" data-en="WATAD Mobile"></h3>
          <p data-ar="حمّل التطبيق من متجر بلاي." data-en="Download it from Google Play."></p>
          <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.watad" target="_blank" rel="noopener" data-ar="تحميل من متجر بلاي" data-en="Download on Google Play"></a>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>NGA</span>
      <span>WATAD</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>

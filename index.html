<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NGA Apex — منظومة إدارة للشركات. تحميل رسمي لمركز الإدارة والسيرفر والفرع.">
  <meta name="theme-color" content="#070B14">
  <title>NGA Apex — تحميل المنظومة</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <img src="assets/logo.png" alt="NGA Apex">
        <span>
          <span class="brand-name">NGA Apex</span>
          <span class="brand-tag" data-ar="منظومة إدارة الشركات" data-en="Company operations platform"></span>
        </span>
      </a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang-btn="ar">العربية</button>
        <button type="button" data-lang-btn="en">English</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <span class="kicker" data-ar="التحميل الرسمي" data-en="Official downloads"></span>
        <h1 data-ar="منظومة NGA Apex لشركتك" data-en="NGA Apex for your company"></h1>
        <p class="lead" data-ar="ثلاثة برامج تعمل داخل شركتك: السيرفر، مركز الإدارة، والفرع. ثبّتها على أجهزتك، والبيانات تبقى لديك." data-en="Three Windows programs for your company: Server, Headquarters, and Branch. Install them on your PCs. Your data stays with you."></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#downloads" data-ar="تحميل البرامج" data-en="Download the apps"></a>
          <a class="btn btn-ghost" href="#order" data-ar="ترتيب التثبيت" data-en="Install order"></a>
        </div>
      </div>
    </section>

    <section class="section" id="downloads">
      <div class="wrap">
        <h2 data-ar="برامج ويندوز" data-en="Windows programs"></h2>
        <p class="section-intro" data-ar="ويندوز 10 أو 11، نسخة 64 بت. كل مثبت يجهّز ما يحتاجه على جهاز الزبون دون الاعتماد على جهاز المطوّر." data-en="Windows 10 or 11, 64-bit. Each installer prepares what that PC needs. It does not depend on the developer machine."></p>

        <div class="cards">
          <article class="card">
            <span class="badge" data-ar="يُثبَّت أولاً" data-en="Install first"></span>
            <h3 data-ar="السيرفر" data-en="Server"></h3>
            <p data-ar="خدمة تعمل على جهاز الشركة وتربط المركز والفروع والهاتف." data-en="A Windows service on the company PC that connects Headquarters, branches, and phones."></p>
            <div class="meta">
              <span>Windows x64</span>
              <span>NGA-Apex-Server-Setup.exe</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-Server-Setup.exe" data-ar="تحميل السيرفر" data-en="Download Server"></a>
          </article>

          <article class="card">
            <span class="badge" data-ar="بعد السيرفر" data-en="After Server"></span>
            <h3 data-ar="مركز الإدارة" data-en="Headquarters"></h3>
            <p data-ar="إدارة الشركة من جهاز الإدارة: الفروع، التقارير، وإعدادات الربط." data-en="Run the company from the HQ PC: branches, reports, and connection settings."></p>
            <div class="meta">
              <span>Windows x64</span>
              <span>NGA-Apex-HQ-Setup.exe</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-HQ-Setup.exe" data-ar="تحميل المركز" data-en="Download Headquarters"></a>
          </article>

          <article class="card">
            <span class="badge" data-ar="على أجهزة الفروع" data-en="On branch PCs"></span>
            <h3 data-ar="الفرع" data-en="Branch"></h3>
            <p data-ar="يعمل في الفرع ويتصل بالسيرفر. قاعدته محلية على جهاز الفرع." data-en="Runs at the branch and connects to the server. Its database stays on the branch PC."></p>
            <div class="meta">
              <span>Windows x64</span>
              <span>NGA-Apex-Branch-Setup.exe</span>
            </div>
            <a class="btn btn-primary" href="https://github.com/tahabligho-pixel/nga-apex/releases/latest/download/NGA-Apex-Branch-Setup.exe" data-ar="تحميل الفرع" data-en="Download Branch"></a>
          </article>
        </div>
      </div>
    </section>

    <section class="section" id="order">
      <div class="wrap">
        <h2 data-ar="ترتيب التثبيت" data-en="Install order"></h2>
        <p class="section-intro" data-ar="ثبّت بهذا الترتيب حتى يجد المركز والفرع السيرفر جاهزاً." data-en="Install in this order so Headquarters and Branch can reach a ready server."></p>
        <div class="order">
          <article class="step">
            <div class="step-num">01</div>
            <h3 data-ar="السيرفر" data-en="Server"></h3>
            <p data-ar="على جهاز الشركة الذي يبقى شغّالاً. بعد التثبيت تظهر صفحة التسجيل عند أول فتح." data-en="On the company PC that stays on. The first launch opens the registration page."></p>
          </article>
          <article class="step">
            <div class="step-num">02</div>
            <h3 data-ar="مركز الإدارة" data-en="Headquarters"></h3>
            <p data-ar="على جهاز الإدارة. اربطه بعنوان السيرفر على الشبكة المحلية." data-en="On the management PC. Connect it using the server’s local network address."></p>
          </article>
          <article class="step">
            <div class="step-num">03</div>
            <h3 data-ar="الفرع" data-en="Branch"></h3>
            <p data-ar="على كل جهاز فرع. اربطه بنفس عنوان السيرفر المتفق عليه في الشركة." data-en="On each branch PC. Connect it with the same server address used by the company."></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap notes">
        <article class="note">
          <h3 data-ar="متطلبات الجهاز" data-en="PC requirements"></h3>
          <ul>
            <li data-ar="ويندوز 10 أو ويندوز 11، 64 بت" data-en="Windows 10 or Windows 11, 64-bit"></li>
            <li data-ar="صلاحية مسؤول عند التثبيت" data-en="Administrator rights during setup"></li>
            <li data-ar="اتصال بالشبكة المحلية بين الأجهزة" data-en="Local network connectivity between the PCs"></li>
          </ul>
        </article>
        <article class="note">
          <h3 data-ar="ملاحظة أمان ويندوز" data-en="Windows security note"></h3>
          <p data-ar="قد يظهر ويندوز تحذيراً لأن الملفات غير موقّعة بعد. اختر المزيد من المعلومات ثم تشغيل إذا حصلت على الملف من هذه الصفحة." data-en="Windows may show a warning because the files are not code-signed yet. Choose More info, then Run anyway if you obtained the file from this page."></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>NGA Apex</span>
      <span data-ar="التحميل من هذه الصفحة فقط." data-en="Download only from this page."></span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
